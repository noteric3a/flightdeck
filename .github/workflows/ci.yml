name: Verify Flightdeck
on:
  push:
  pull_request:
jobs:
  service-and-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: pytest -q
      - run: node --test tests/*.test.mjs
      - run: node scripts/generate_device_assets.mjs --check
      - run: docker build -t flightdeck:test .
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-firmware.txt
      - run: python -m pip check
      - run: pio run -d firmware -e esp32dev -e esp32s3
      - run: python scripts/test_device_provider.py
